<div class="recovery-page">
  <div class="recovery-box">
    <h2>Восстановление</h2>
    <p class="hint-text">Введите адрес эл. почты для восстановления пароля.</p>

    <form>
      <div class="form-group">
        <input type="email" placeholder="Введите e-mail" required />
      </div>

      <div class="buttons">
        <button
          type="button"
          class="cancel-btn"
          (click)="goBack()"
        >
          Отмена
        </button>
        <button
    type="button"
    class="send-btn"
    (click)="onSendCode()"
        >
        Отправить код
</button>
      </div>
    </form>
  </div>
</div>

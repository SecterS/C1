<div class="recovery-page">
  <div class="recovery-box">
    <h2>Восстановление</h2>
    <p class="hint-text">Введите адрес эл. почты для восстановления пароля.</p>

    <!-- Блок ошибки -->
    <div *ngIf="error" style="color: #ff6b6b; margin-bottom: 15px; font-size: 14px; text-align: center;">
      ⚠️ {{ error }}
    </div>

    <!-- (ngSubmit) позволяет отправлять форму по нажатию Enter -->
    <form (ngSubmit)="onSendCode()">
      <div class="form-group">
        <input 
          type="email" 
          name="email"
          [(ngModel)]="email"
          (input)="error = ''"
          placeholder="Введите e-mail" 
          required 
        />
      </div>

      <div class="buttons">
        <button
          type="button"
          class="cancel-btn"
          (click)="goBack()"
        >
          Отмена
        </button>
        
        <button
          type="submit"
          class="send-btn"
          [disabled]="isLoading"
        >
          {{ isLoading ? 'Отправка...' : 'Отправить код' }}
        </button>
      </div>
    </form>
  </div>
</div>

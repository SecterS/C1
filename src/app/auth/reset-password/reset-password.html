<div class="recovery-page">
  <div class="recovery-box">
    <h2>Смена пароля</h2>
    <p>Введите два раза новый пароль. Пароль должен иметь не менее 8 символов и включать цифры и буквы.</p>

    <form>
      <div class="form-group">
        <label for="password1">Новый пароль</label>
        <input id="password1" type="password" placeholder="Введите пароль" required />
      </div>

      <div class="form-group">
        <label for="password2">Повторите пароль</label>
        <input id="password2" type="password" placeholder="Повторите пароль" required />
      </div>

      <div class="buttons">
        <button type="button" class="cancel-btn" (click)="onCancel()">Отмена</button>
        <button type="submit" class="send-btn" (click)="onSubmit()">Сохранить</button>
      </div>
    </form>
  </div>
</div>

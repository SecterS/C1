<div class="recovery-page">
  <div class="recovery-box">
    <h2>Смена пароля</h2>
    <p class="hint-text">Введите новый пароль дважды. Пароль должен быть не менее 8 символов.</p>

    <div *ngIf="error" style="color: #ff6b6b; margin-bottom: 15px; font-size: 14px; text-align: center;">
      ⚠️ {{ error }}
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="password">Новый пароль</label>
        <input 
          id="password" 
          name="password"
          type="password" 
          [(ngModel)]="password"
          (input)="error = ''"
          placeholder="Введите пароль" 
          required 
        />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Повторите пароль</label>
        <input 
          id="confirmPassword" 
          name="confirmPassword"
          type="password" 
          [(ngModel)]="confirmPassword"
          (input)="error = ''"
          placeholder="Повторите пароль" 
          required 
        />
      </div>

      <div class="buttons">
        <button type="button" class="cancel-btn" (click)="onCancel()">Отмена</button>
        
        <button 
          type="submit" 
          class="send-btn" 
          [disabled]="isLoading">
          {{ isLoading ? 'Сохранение...' : 'Сохранить' }}
        </button>
      </div>
    </form>
  </div>
</div>

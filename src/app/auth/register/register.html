<div class="register-box">
  <h2>Регистрация</h2>

 
  <div *ngIf="errorMessage" style="color: #ff6b6b; margin-bottom: 15px; font-size: 14px; text-align: center;">
    ⚠️ {{ errorMessage }}
  </div>

  <form (ngSubmit)="onSubmit()">

    <div class="form-group">
      <label for="firstName">Имя <span>*</span></label>
      <input type="text" id="firstName" name="firstName" [(ngModel)]="firstName" placeholder="Введите имя" required />
    </div>

    <div class="form-group">
      <label for="lastName">Фамилия <span>*</span></label>
      <input type="text" id="lastName" name="lastName" [(ngModel)]="lastName" placeholder="Введите фамилию" required />
    </div>


    <div class="form-group">
      <label for="email">E-mail (Логин) <span>*</span></label>
      <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="Введите e-mail" required />
    </div>

    <div class="form-group">
      <label for="password">Пароль <span>*</span></label>
      <input type="password" id="password" name="password" [(ngModel)]="password" placeholder="Введите пароль" required />
    </div>

    <div class="form-group">
      <label for="confirmPassword">Повторите пароль</label>
      <input type="password" id="confirmPassword" name="confirmPassword" [(ngModel)]="confirmPassword" placeholder="Повторите пароль" required />
    </div>

    <div style="font-size: 12px; color: #888; margin-top: 10px;">
      * - обязательные поля для ввода 
    </div>

    <div class="buttons">

      <button type="submit" class="register-btn" [disabled]="isLoading">
        {{ isLoading ? 'Загрузка...' : 'Зарегистрироваться' }}
      </button>
      <button type="button" class="cancel-btn" (click)="onCancel()">Отмена</button>
    </div>
  </form>
</div>

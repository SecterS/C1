<div class="login-page">
  <div class="login-box">
    <h2>Вход</h2>


    <form>
      <div class="form-group">
        <label for="username">Логин или email</label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="Введите логин или email"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Пароль</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Введите пароль"
          required
        />
      </div>

      <div class="login-options">
        <div class="remember-me">
          <input type="checkbox" id="remember" name="remember" />
          <label for="remember">Запомнить меня</label>
        </div>

        <button type="button" class="register-btn" (click)="showRegisterModal()">
          Регистрация
        </button>
      </div>

      <button type="submit" class="login-btn">Войти</button>
    </form>

    <a routerLink="/recovery" class="help-link">Помогите, не могу войти</a>

    <div class="modal-overlay" *ngIf="showRegister" (click)="hideRegisterModal()">
      <div class="modal-window" (click)="$event.stopPropagation()">
        <app-register
          (close)="hideRegisterModal()"
          (success)="onRegisterSuccess()">
        </app-register>
      </div>
    </div>
  </div>
</div>
